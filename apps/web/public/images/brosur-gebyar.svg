<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031b33" />
      <stop offset="50%" stop-color="#083358" />
      <stop offset="100%" stop-color="#02475e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Geometric & Ambient Patterns -->
  <circle cx="1100" cy="80" r="320" fill="#06b6d4" opacity="0.12" />
  <circle cx="100" cy="580" r="280" fill="#10b981" opacity="0.1" />
  <circle cx="950" cy="520" r="220" fill="#f59e0b" opacity="0.08" />

  <!-- Diagonal dynamic accent lines -->
  <path d="M-50,200 L1250,50" stroke="#38bdf8" stroke-width="2" opacity="0.2" />
  <path d="M-50,240 L1250,90" stroke="#38bdf8" stroke-width="1" opacity="0.15" />
  <path d="M-50,600 L1250,450" stroke="#34d399" stroke-width="2" opacity="0.2" />

  <!-- Top Header Ribbon -->
  <rect x="80" y="45" width="480" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <circle cx="105" cy="66" r="7" fill="#38bdf8" />
  <text x="125" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e0f2fe" letter-spacing="2">
    PERUMDA TIRTAWENING KOTA BANDUNG
  </text>

  <!-- Special Edition Badge -->
  <rect x="910" y="45" width="210" height="42" rx="21" fill="url(#goldGrad)" filter="url(#shadow)" />
  <text x="1015" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b" letter-spacing="1.5">
    EDISI SPESIAL 2026
  </text>

  <!-- Main Headline Banner Box -->
  <g transform="translate(80, 130)">
    <!-- Sub-badge -->
    <rect x="0" y="0" width="240" height="34" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5" />
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7" letter-spacing="1">
      ★ PROGRAM RESMI PEMKOT
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      GEBYAR SAMBUNGAN BARU
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#38bdf8">
      &amp; BEBAS BIAYA BALIK NAMA 100%
    </text>
    <text x="0" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      Akses air bersih higienis standar perpipaan untuk seluruh warga Kota Bandung dengan biaya super hemat.
    </text>
  </g>

  <!-- Big Promo Highlights Card -->
  <g transform="translate(80, 370)" filter="url(#shadow)">
    <!-- Card 1: Diskon 35% -->
    <rect x="0" y="0" width="310" height="220" rx="24" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" />
    <rect x="24" y="24" width="70" height="30" rx="15" fill="#0284c7" />
    <text x="59" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">HEMAT</text>
    <text x="24" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#38bdf8">35%</text>
    <text x="24" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Diskon Pasang Baru</text>
    <text x="24" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Untuk sambungan rumah tangga golongan 2A s.d 2D.</text>

    <!-- Card 2: Gratis Balik Nama -->
    <rect x="330" y="0" width="310" height="220" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="354" y="24" width="76" height="30" rx="15" fill="#059669" />
    <text x="392" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">GRATIS</text>
    <text x="354" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#34d399">Rp 0</text>
    <text x="354" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Biaya Balik Nama</text>
    <text x="354" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Ubah kepemilikan meter air tanpa biaya administrasi.</text>

    <!-- Card 3: Cicilan Ringan & Syarat Mudah -->
    <rect x="660" y="0" width="380" height="220" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect x="684" y="24" width="90" height="30" rx="15" fill="#d97706" />
    <text x="729" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CICILAN 0%</text>
    <text x="684" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#fbbf24">✓ Pemasangan Kilat 1x24 Jam</text>
    <text x="684" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">✓ Meter Air Digital SNI Resmi</text>
    <text x="684" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">✓ Cukup KTP &amp; PBB Terakhir</text>
    <text x="684" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Bisa dicicil 6x bayar tagihan bulanan.</text>
  </g>

  <!-- Water Drop Artwork Illustration on Right -->
  <g transform="translate(1010, 240)" filter="url(#shadow)">
    <path d="M60,0 C60,0 120,80 120,130 C120,170 85,200 45,200 C5,200 -30,170 -30,130 C-30,80 60,0 60,0 Z" fill="url(#cyanGrad)" opacity="0.85" />
    <path d="M40,60 C40,60 70,105 70,130 C70,148 55,160 38,160 C21,160 10,148 10,130 C10,105 40,60 40,60 Z" fill="#ffffff" opacity="0.35" />
  </g>
</svg>
