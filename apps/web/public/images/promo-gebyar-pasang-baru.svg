<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192d" />
      <stop offset="50%" stop-color="#0b3056" />
      <stop offset="100%" stop-color="#023e54" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="goldP1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadowP1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgP1)" />

  <!-- Decorative circles -->
  <circle cx="1080" cy="90" r="300" fill="#00f2fe" opacity="0.12" />
  <circle cx="120" cy="580" r="260" fill="#10b981" opacity="0.1" />

  <!-- Top Ribbon -->
  <rect x="70" y="45" width="460" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <circle cx="95" cy="66" r="7" fill="#00f2fe" />
  <text x="115" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e0f2fe" letter-spacing="2">
    PERUMDA TIRTAWENING KOTA BANDUNG
  </text>

  <!-- Badge Promo -->
  <rect x="880" y="45" width="250" height="42" rx="21" fill="url(#goldP1)" filter="url(#shadowP1)" />
  <text x="1005" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a" letter-spacing="1.5">
    PROGRAM SPESIAL 2026
  </text>

  <!-- Main Headline Title -->
  <text x="70" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="3">
    GEBYAR SAMBUNGAN BARU
  </text>
  <text x="70" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Diskon Sambungan 35%
  </text>
  <text x="70" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="url(#accentCyan)">
    &amp; Bebas Bea Balik Nama 100%
  </text>

  <!-- Subheadline -->
  <text x="70" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1">
    Nikmati air bersih perpipaan higienis berstandar baku mutu kesehatan untuk keluarga Anda.
  </text>

  <!-- Feature Cards Grid -->
  <g transform="translate(70, 385)">
    <rect x="0" y="0" width="320" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
      HEMAT BIAYA
    </text>
    <text x="24" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      Potongan s.d. 35%
    </text>
  </g>

  <g transform="translate(415, 385)">
    <rect x="0" y="0" width="320" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#34d399">
      GRATIS ADMINISTRASI
    </text>
    <text x="24" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      Balik Nama Rp 0,-
    </text>
  </g>

  <g transform="translate(760, 385)">
    <rect x="0" y="0" width="370" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">
      CICILAN RINGAN
    </text>
    <text x="24" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      Bunga 0% s.d 6 Bulan
    </text>
  </g>

  <!-- Footer Watermark & Period -->
  <line x1="70" y1="540" x2="1130" y2="540" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
  <text x="70" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">
    PERIODE: 1 NOVEMBER – 30 NOVEMBER 2026 • BERLAKU DI SELURUH KOTA BANDUNG
  </text>
  <text x="1130" y="585" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    PENDAFTARAN RESMI VIA PORTAL WEB
  </text>
</svg>