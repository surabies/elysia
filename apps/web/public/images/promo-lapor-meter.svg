    </text>
  </g>

  <!-- Footer Watermark & Period -->
  <line x1="70" y1="540" x2="1130" y2="540" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
  <text x="70" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">
    PERIODE PELAPORAN: TANGGAL 1 S.D. 20 SETIAP BULAN BERJALAN
  </text>
  <text x="1130" y="585" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#c084fc">
    LAPOR VIA MENU LAPOR METER
  </text>
</svg>