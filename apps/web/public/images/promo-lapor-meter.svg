<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18112e" />
      <stop offset="50%" stop-color="#28174f" />
      <stop offset="100%" stop-color="#150d30" />
    </linearGradient>
    <linearGradient id="purpleGradP3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="badgeGradP3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgP3)" />

  <!-- Ambient Glows -->
  <circle cx="1080" cy="110" r="290" fill="#a855f7" opacity="0.12" />
  <circle cx="110" cy="570" r="250" fill="#3b82f6" opacity="0.1" />

  <!-- Top Ribbon -->
  <rect x="70" y="45" width="460" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <circle cx="95" cy="66" r="7" fill="#c084fc" />
  <text x="115" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e0f2fe" letter-spacing="2">
    PERUMDA TIRTAWENING KOTA BANDUNG
  </text>

  <!-- Badge Promo -->
  <rect x="830" y="45" width="300" height="42" rx="21" fill="url(#badgeGradP3)" />
  <text x="980" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    GERAKAN DIGITALISASI 2026
  </text>

  <!-- Main Headline Title -->
  <text x="70" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#c084fc" letter-spacing="3">
    GEBYAR DIGITAL MANDIRI
  </text>
  <text x="70" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
