<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="50%" stop-color="#1b2a47" />
      <stop offset="100%" stop-color="#0f2137" />
    </linearGradient>
    <linearGradient id="emeraldGradP2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="badgeGradP2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgP2)" />

  <!-- Ambient Glows -->
  <circle cx="1050" cy="120" r="280" fill="#10b981" opacity="0.12" />
  <circle cx="100" cy="550" r="240" fill="#38bdf8" opacity="0.08" />

  <!-- Top Ribbon -->
  <rect x="70" y="45" width="460" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <circle cx="95" cy="66" r="7" fill="#10b981" />
  <text x="115" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e0f2fe" letter-spacing="2">
    PERUMDA TIRTAWENING KOTA BANDUNG
  </text>

  <!-- Badge Promo -->
  <rect x="850" y="45" width="280" height="42" rx="21" fill="url(#badgeGradP2)" />
  <text x="990" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    BULAN PEDULI PELANGGAN
  </text>

  <!-- Main Headline Title -->
  <text x="70" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#34d399" letter-spacing="3">
    PROGRAM RELAKSASI PEMBAYARAN
  </text>
  <text x="70" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Bebas Denda Rekening 100%
  </text>
  <text x="70" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="url(#emeraldGradP2)">
    &amp; Kemudahan Skema Angsuran Tunggakan
  </text>

  <!-- Subheadline -->
  <text x="70" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1">
    Kesempatan emas penertiban administrasi sambungan air bersih tanpa beban denda tambahan.
  </text>

  <!-- Feature Cards Grid -->
  <g transform="translate(70, 385)">
    <rect x="0" y="0" width="320" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#34d399">
      BEBAS DENDA
    </text>
    <text x="24" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      Denda Dihapus 100%
    </text>
  </g>

  <g transform="translate(415, 385)">
    <rect x="0" y="0" width="320" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
      ANGSURAN FLEKSIBEL
    </text>
    <text x="24" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      Cicil Sesuai Kemampuan
    </text>
  </g>

  <g transform="translate(760, 385)">
    <rect x="0" y="0" width="370" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">
      REAKTIVASI SAMBUNGAN
    </text>
    <text x="24" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      Aliran Air Langsung Aktif
    </text>
  </g>

  <!-- Footer Watermark & Period -->
  <line x1="70" y1="540" x2="1130" y2="540" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
  <text x="70" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">
    PERIODE KHUSUS RELAKSASI • BERLAKU UNTUK SELURUH GOLONGAN TARIF PELANGGAN
  </text>
  <text x="1130" y="585" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#34d399">
    CEK REKENING VIA FITUR CEK TAGIHAN
  </text>
</svg>